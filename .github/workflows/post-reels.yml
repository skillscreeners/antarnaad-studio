name: Post Antarnaad reels

on:
  schedule:
    # GitHub delays and drops scheduled runs, so check every 10 minutes during posting hours
    # (01:00–16:59 UTC = 06:30–22:29 IST). The "check" job posts only when a slot is due
    # and not yet marked posted (git tag posted-YYYY-MM-DD-sN), so nothing posts twice.
    - cron: "*/10 1-16 * * *"
  repository_dispatch:
    # external scheduler (Google Cloud Scheduler) sends {"event_type": "tick"} every 10 minutes
    types: [tick]
  workflow_dispatch:
    inputs:
      slot:
        description: "Slot 1–5 (leave empty for the slot due now)"
        required: false
      date:
        description: "Date YYYY-MM-DD (default today, IST)"
        required: false
      dry_run:
        description: "Render only, do not post"
        type: boolean
        default: true
      preview_day:
        description: "Render all 5 reels for this date and attach them (no posting)"
        required: false
      force:
        description: "Post even if the slot is already marked posted"
        type: boolean
        default: false
      mark_posted:
        description: "Only mark slots as already posted, e.g. 2026-11-05:2,2026-11-05:3"
        required: false

permissions:
  contents: write   # create posted-* tags
  actions: read

jobs:
  check:
    if: ${{ github.event_name == 'schedule' || github.event_name == 'repository_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      slot: ${{ steps.due.outputs.slot }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            pipeline
            data
      - id: due
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 pipeline/due.py
      - name: Collect YouTube stats for the feedback loop (every 3 h)
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 pipeline/collect_stats.py

  mark:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.mark_posted != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            pipeline
            data
      - env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 pipeline/due.py --mark "${{ inputs.mark_posted }}"

  reel:
    needs: check
    if: ${{ always() && ((github.event_name == 'workflow_dispatch' && inputs.mark_posted == '') || needs.check.outputs.slot != '') }}
    concurrency:
      group: antarnaad-post
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TZ: Asia/Kolkata
      ANTARNAAD_FONT_DIR: ${{ github.workspace }}/assets/fonts
      YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
      YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
      YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
      YT_PRIVACY: ${{ vars.YT_PRIVACY || 'public' }}
      IG_USER_ID: ${{ secrets.IG_USER_ID }}
      IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
      ANTARNAAD_VOICE_HI: ${{ vars.ANTARNAAD_VOICE_HI || 'hi-IN-MadhurNeural' }}
      ANTARNAAD_VOICE_EN: ${{ vars.ANTARNAAD_VOICE_EN || 'en-IN-PrabhatNeural' }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Python packages
        timeout-minutes: 6
        run: pip install -q -r requirements.txt imageio-ffmpeg

      - name: ffmpeg (static build from PyPI; apt mirrors on runners can hang)
        timeout-minutes: 3
        run: |
          if ! command -v ffmpeg >/dev/null; then
            sudo ln -sf "$(python -c 'import imageio_ffmpeg as f; print(f.get_ffmpeg_exe())')" /usr/local/bin/ffmpeg
          fi
          ffmpeg -version | head -1

      - name: Hindi text shaping (fonts are in assets/fonts)
        timeout-minutes: 6
        run: |
          RAQM='from PIL import features; assert features.check("raqm")'
          python -c "$RAQM" || { sudo timeout 120 apt-get install -y -qq libfribidi0 >/dev/null 2>&1 \
            || { sudo timeout 150 apt-get update -qq && sudo timeout 120 apt-get install -y -qq libfribidi0; }; }
          python -c "$RAQM" && echo "Hindi shaping OK"

      - name: Preview a whole day
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.preview_day != '' }}
        run: python pipeline/run_slot.py --preview "${{ inputs.preview_day }}"

      - name: Render and post
        if: ${{ github.event_name == 'schedule' || inputs.preview_day == '' }}
        run: |
          ARGS=""
          [ -n "${{ needs.check.outputs.slot }}" ] && ARGS="$ARGS --slot ${{ needs.check.outputs.slot }}"
          [ -n "${{ inputs.slot }}" ] && ARGS="$ARGS --slot ${{ inputs.slot }}"
          [ -n "${{ inputs.date }}" ] && ARGS="$ARGS --date ${{ inputs.date }}"
          [ "${{ inputs.dry_run }}" = "true" ] && ARGS="$ARGS --dry-run"
          [ "${{ inputs.force }}" = "true" ] && ARGS="$ARGS --force"
          python pipeline/run_slot.py $ARGS

      - name: Keep the reels for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reels-${{ github.run_id }}
          path: |
            out/*.mp4
            out/*.json
          if-no-files-found: ignore
          retention-days: 7
