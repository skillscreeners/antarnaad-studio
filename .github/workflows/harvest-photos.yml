name: Harvest background photos

on:
  workflow_dispatch:
    inputs:
      per_query:
        description: "Photos per search term"
        default: "3"

permissions:
  contents: write

jobs:
  harvest:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -q -r requirements.txt
      - env:
          PER_QUERY: ${{ inputs.per_query }}
        run: python tools/harvest_photos.py
      - run: |
          git config user.name "antarnaad-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/photos
          git diff --cached --quiet || { git commit -m "Add CC0 background photos"; git pull --rebase -q; git push; }
